services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-python/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: legal-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://raguser:ragpass@postgres:5432/ragdb
      - POSTGRES_URL=postgresql://raguser:ragpass@postgres:5432/ragdb
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      # retriever dùng fastembed trong Docker — model phải có trong fastembed 0.4.x
      - FASTEMBED_EMBEDDING_MODEL=intfloat/multilingual-e5-large
      - COLLECTION_NAME=legal_chunks
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
    volumes:
      - ./backend-python:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/api --reload-dir /app/retriever --reload-dir /app/generator --reload-dir /app/guard --reload-dir /app/routers --reload-dir /app/auth

  orchestration:
    build:
      context: ./spring-boot/orchestration-service
      dockerfile: Dockerfile
    container_name: legal-orchestration
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ragdb
      - SPRING_DATASOURCE_USERNAME=raguser
      - SPRING_DATASOURCE_PASSWORD=ragpass
      - PYTHON_API_BASE_URL=http://backend:8000
      - APP_JWT_SECRET=legal-rag-super-secret-key-2024-must-be-32-chars
      - APP_JWT_EXPIRATION_MS=86400000
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - backend

  frontend-dev:
    image: node:20-alpine
    container_name: legal-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend-vue:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - orchestration

volumes:
  postgres_data:
  qdrant_data:
