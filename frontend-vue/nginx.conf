server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── FastAPI :8000 routes (phải đặt TRƯỚC rule /api chung) ─────────────
    # AI query/compare/evaluate → FastAPI (strip /api prefix)
    location /api/ai/ {
        proxy_pass http://host.docker.internal:8000/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI cần timeout dài (Groq ~20-30s, embedding ~60s)
        proxy_read_timeout 900s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
    }

    # Admin routes → FastAPI (strip /api prefix)
    location /api/admin/ {
        proxy_pass http://host.docker.internal:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health check → FastAPI
    location /api/health {
        proxy_pass http://host.docker.internal:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Spring Boot :8081 routes ──────────────────────────────────────────
    # Tất cả /api còn lại (auth, users, history...) → Spring Boot
    location /api/ {
        proxy_pass http://host.docker.internal:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}